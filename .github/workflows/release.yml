name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath '.\Directory.Build.props' -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version source introuvable.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tagVersion -ne $version) {
              throw "Le tag $($env:GITHUB_REF_NAME) ne correspond pas à la version source $version."
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install packaging tools
        shell: pwsh
        run: choco install 7zip innosetup --no-progress -y

      - name: Public release audit
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\scripts\Test-PublicRelease.ps1

      - name: Build, test and package
        shell: pwsh
        run: |
          .\scripts\Publish-Release.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -DownloadLibMpv `
            -BuildInstaller

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Explorer-${{ steps.version.outputs.version }}-win-x64
          if-no-files-found: error
          path: |
            dist/IPTV-Explorer-Setup-${{ steps.version.outputs.version }}-x64.exe
            dist/IPTV-Explorer-${{ steps.version.outputs.version }}-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\dist\IPTV-Explorer-Setup-${{ steps.version.outputs.version }}-x64.exe" `
            ".\dist\IPTV-Explorer-${{ steps.version.outputs.version }}-win-x64.zip" `
            ".\dist\SHA256SUMS.txt" `
            --title "IPTV Explorer ${{ steps.version.outputs.version }}" `
            --notes-file ".\docs\release-notes-v1.0.0.md"
