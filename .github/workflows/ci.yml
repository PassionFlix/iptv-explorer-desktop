name: CI

on:
  push:
    branches:
      - main
      - phase-3-libmpv
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore .\IPTVExplorer.Desktop.sln

      - name: Build
        run: dotnet build .\IPTVExplorer.Desktop.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\IPTVExplorer.Desktop.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Whitespace check
        shell: bash
        run: git diff --check HEAD^
