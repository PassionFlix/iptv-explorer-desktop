name: Bug report
about: Signaler un problème reproductible
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de ne publier aucun username, password, MAC, token, cookie, Authorization ou URL fournisseur privée.
  - type: input
    id: version
    attributes:
      label: Version IPTV Explorer
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Type de fournisseur concerné
      options:
        - Non applicable
        - Xtream Codes
        - Stalker / MAG
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décrivez le problème sans information sensible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
  - type: textarea
    id: environment
    attributes:
      label: Environnement
      placeholder: Windows 11 x64, version IPTV Explorer, etc.
